services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: arta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arta -d arta"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://arta:${POSTGRES_PASSWORD}@db:5432/arta
      STORAGE_LOCAL_DIR: /app/var/storage
    ports:
      - "8000:8000"
    volumes:
      - material_images:/app/var/storage
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"]
volumes:
  postgres_data:
  material_images:
